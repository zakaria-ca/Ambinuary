<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Access Restricted</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 40px;
      border-radius: 8px;
      background-color: white;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .flag {
      width: 80px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    p {
      font-size: 16px;
      color: #6c757d;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #adb5bd;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/20/Flag_of_the_Netherlands.svg" alt="Dutch Flag" class="flag" />
    <h1>Access Denied</h1>
    <p>You cannot open this page from outside<br><strong>The Kingdom of The Netherlands</strong>.</p>
    <p>U kunt deze pagina niet openen van buiten het<br><strong>Koninkrijk der Nederlanden</strong>.</p>
    <div class="footer">
      &copy; 2025 Secure Access System
    </div>
  </div>
</body>
</html>
